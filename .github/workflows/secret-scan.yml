name: Secret Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  gitleaks:
    name: Detect secrets with gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  check-localhost:
      name: Check for hardcoded localhost URLs
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Scan for hardcoded localhost
          run: |
            if grep -rEn "https?://(localhost|127\.0\.0\.1)" --include="*.py" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.git --exclude="cypress.config.ts" .; then
              echo "Hardcoded localhost URLs found!"
              exit 1
            else
              echo "No hardcoded localhost URLs found."
            fi